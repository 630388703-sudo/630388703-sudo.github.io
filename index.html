<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syra Diao · Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
  <p class="loading-title" data-i18n="loading_title">SYRA'S <span>PORTFOLIO</span></p>
  <p class="loading-sub" data-i18n="loading_sub">Loading...</p>
  <div class="progress-wrap">
    <div class="progress-bar"></div>
  </div>
  <p class="progress-pct">0%</p>
</div>

<!-- Nav -->
<nav>
  <a href="index.html" class="nav-logo">Syra<span>.</span></a>
  <ul class="nav-links">
    <li><a href="index.html"    data-i18n="nav_home">HOME</a></li>
    <li><a href="about.html"   data-i18n="nav_about">ABOUT</a></li>
    <li><a href="projects.html" data-i18n="nav_projects">PROJECTS</a></li>
    <li><a href="刁思予_简历.pdf" target="_blank" data-i18n="nav_resume">RESUME</a></li>
  </ul>
  <button class="lang-toggle" aria-label="Switch language">中文</button>
  <div class="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <div class="hero-inner">
    <!-- Character -->
    <div class="character-wrap reveal-left">
      <div class="hearts-container" id="hearts"></div>
      <img
        id="char-img"
        class="character-img"
        src="Typing（坐在电脑前设计）.png"
        alt="Syra character"
        data-default="Typing（坐在电脑前设计）.png"
        data-hover="HOVER 打招呼.png"
        data-click="CLICK 爱心跳一下.png"
      />
    </div>

    <!-- Text -->
    <div class="hero-text reveal-right">
      <p class="hero-greeting" data-i18n="hero_greeting">Hi, I'm</p>
      <h1 class="hero-name">
        <span class="accent" data-i18n="hero_name">Syra</span>
      </h1>
      <p class="hero-role" data-i18n="hero_role">UX Designer &amp; Interactive Media Student</p>
      <p class="hero-desc" data-i18n="hero_desc">
        Designing meaningful experiences through storytelling, interaction and play.
      </p>
      <div class="hero-cta">
        <a href="projects.html" class="btn btn-primary" data-i18n="hero_btn1">View Projects</a>
        <a href="about.html"    class="btn btn-secondary" data-i18n="hero_btn2">About Me</a>
      </div>
    </div>
  </div>

  <div class="scroll-hint">
    <span data-i18n="scroll_hint">SCROLL</span>
    <div class="scroll-arrow"></div>
  </div>
</section>

<!-- Footer -->
<footer>
  <p data-i18n="footer">Made with ♥ by Syra Diao · 2024</p>
</footer>

<!-- Music -->
<audio id="bg-music" loop preload="none">
  <source src="ai视频.mp4" type="video/mp4">
</audio>
<button id="music-btn" aria-label="Toggle music">🎵</button>

<script src="main.js"></script>
</body>
</html>
